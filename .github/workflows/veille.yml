# .github/workflows/veille.yml
# Exécution automatique chaque lundi à 05:00 UTC
# Déclenchement manuel possible via l'onglet Actions → Run workflow
name: Flash veille IA hebdomadaire
on:
  schedule:
    - cron: "0 5 * * 1"   # Lundi 05:00 UTC
  workflow_dispatch:        # Déclenchement manuel
jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Installation des dépendances
        run: pip install -r requirements.txt
      - name: Exécution du pipeline
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_TOKEN:      ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
        run: python run_pipeline.py
      - name: Commit seen_hashes.json
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_hashes.json
          git diff --staged --quiet || git commit -m "chore: update seen_hashes [skip ci]"
          git push
      - name: Upload des logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veille-logs-${{ github.run_number }}
          path: logs/veille.log
          retention-days: 30
